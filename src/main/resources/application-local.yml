spring:
  # H2 데이터베이스 설정
  datasource:
    driver-class-name: org.h2.Driver
    # mem:saseum_db;MODE=MySQL -> 메모리 모드 사용, MySQL 문법 호환 설정
    url: jdbc:h2:mem:saseum_db;MODE=MySQL;NON_KEYWORDS=USER
    username: sa
    password:

  # H2 콘솔 설정 (브라우저에서 DB 확인용)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 100
